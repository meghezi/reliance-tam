<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ page.title }} | ReLiance</title>
    <link rel="stylesheet" href="/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body, html {
            margin: 0 !important;
            padding: 0 !important;
            width: 100% !important;
            font-family: 'Montserrat', sans-serif;
            background-color: #ffffff;
            color: #333;
            line-height: 1.6;
        }
        .header-block { width: 100%; margin: 0; padding: 0; display: block; }
        .logo-black-bg {
            background-color: #000000;
            width: 100%;
            padding: 2rem 0 1rem 0;
            margin: 0;
            display: flex;
            justify-content: center;
        }
        .logo-container { width: 100%; max-width: 800px; display: flex; justify-content: center; }
        .logo-container img { max-width: 100%; height: auto; }
        .main-nav {
            background-color: #000000;
            width: 100%;
            padding: 1rem 0 1.5rem 0;
            border-bottom: 2px solid #8e27ec;
        }
        .nav-list {
            list-style: none; margin: 0; padding: 0;
            display: flex; justify-content: center; align-items: center;
            gap: 2rem; flex-wrap: wrap;
        }
        .nav-list li a {
            color: #ffffff; text-decoration: none;
            font-weight: 600; font-size: 1rem; transition: color 0.3s ease;
        }
        .nav-list li a:hover { color: #b9f1aa; }
        .nav-list li a.blog-link { color: #3dc7c9; font-weight: 700; }
        .nav-list li a.blog-link:hover { color: #ffffff; }
        .text-green-bg {
            background-color: #b9f1aa;
            width: 100%;
            padding: 1.5rem 0;
            margin: 0;
            text-align: center;
        }
        .text-green-bg h1 {
            margin: 0; font-size: 2.5rem; font-weight: 700; color: #8e27ec;
        }
        .text-green-bg p {
            margin: 0.5rem 0 0; font-size: 1.2rem; color: #8e27ec; opacity: 0.9;
        }
        .page-content { padding: 3rem 0; background-color: #ffffff; }
        .page-content .container { width: 90%; max-width: 1200px; margin: 0 auto; padding: 0 20px; }
        footer {
            background-color: #000000; color: white;
            text-align: center; padding: 2rem 0; margin: 0;
        }
        footer img { max-width: 150px; }
        footer a { color: #a16cd9; text-decoration: none; }
        footer a:hover { text-decoration: underline; }
        .section h2 {
            color: #8e27ec; text-align: center;
            margin-bottom: 2rem; font-size: 2rem;
        }
        a { color: #8e27ec; text-decoration: none; }
        a:hover { text-decoration: underline; }
        /* Cartes articles du blog */
        .post-card {
            background-color: #f8f9fa;
            border-left: 5px solid #8e27ec;
            border-radius: 8px;
            padding: 1.5rem;
            margin-bottom: 1.5rem;
            transition: border-color 0.3s ease;
        }
        .post-card:hover { border-left-color: #3dc7c9; }
        .post-card h2 { margin: 0 0 0.5rem; font-size: 1.5rem; }
        .post-card h2 a { color: #8e27ec; font-weight: 700; }
        .post-card h2 a:hover { color: #8536d5; }
        .post-card .post-date {
            color: #eea830; font-size: 0.95rem; font-weight: 600;
            margin: 0 0 0.5rem;
        }
        .post-meta {
            font-size: 1.1rem; color: #666;
            border-top: 1px solid #eee;
            margin-top: 2rem; padding-top: 1.5rem;
        }
        .post-content h2 { color: #8e27ec; font-size: 1.6rem; margin-top: 2rem; }
        .post-content h3 {
            color: #8e27ec; font-size: 1.4rem; margin-top: 1.8rem;
            border-bottom: 2px solid #b9f1aa;
            padding-bottom: 0.3rem; display: inline-block;
        }
    </style>
</head>

<script>
  document.querySelectorAll('a[href^="http"]').forEach(function(link) {
    //Pour ouvrir les liens hypertextes dans un nouvel onglet. Ne touche pas les liens internes au site
    if (link.hostname !== window.location.hostname) {
      link.target = '_blank';
      link.rel = 'noopener';
    }
  });
</script>
    
<body>
    <div class="header-block">
        <div class="logo-black-bg">
            <div class="logo-container">
                <img src="/images/logo-reliance.png" alt="Logo ReLiance">
            </div>
        </div>
        <nav class="main-nav">
            <ul class="nav-list">
                <li><a href="/">Accueil</a></li>
                <li><a href="/#approach">Notre approche</a></li>
                <li><a href="/#tam">Projet TAM</a></li>
                <li><a href="/#timeline">Réalisations</a></li>
                <li><a href="/blog/" class="blog-link">Blog</a></li>
            </ul>
        </nav>
    </div>

    <div class="text-green-bg">
        <h1>{{ page.title }}</h1>
    </div>

    <main class="page-content">
        <div class="container">
            {{ content }}
        </div>
    </main>

    <footer>
        <div class="container">
            <div style="padding: 1rem; display: flex; justify-content: center;">
                <img src="/images/logo-reliance.png" alt="Logo ReLiance">
            </div>
            <p style="margin: 1rem 0;">© 2026 ReLiance. Tous droits réservés.</p>
            <p style="margin: 0.5rem 0;">
                Contact : <a href="mailto:isabelle@reliance-tam.com">isabelle@reliance-tam.com</a>
            </p>
            <p style="margin: 0.5rem 0;">
                <a href="{{ site.url }}/confidentialite-etude-tam/">Politique de confidentialité — Étude de marché TAM</a>
            </p>
        </div>
    </footer>
</body>
</html>
